# Speaker: share hw:0,0 (I2S -> TAS5805M amp) between players with dmix, so music, alarms
# and other sounds can play at once. 48 kHz, which the amp's DSP (Lenovo's tuning) expects.
pcm.speaker {
	type dmix
	ipc_key 5805
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 2
		# 100 ms periods (a multiple of 10 ms, so a whole number of frames at both 48 and
		# 44.1 kHz) x 5: bluez-alsa's advice for Bluetooth audio, which is usually 44.1 kHz,
		# resampled into dmix ("ALSA devices with bluealsa-aplay" on its wiki).
		period_time 100000
		periods 5
	}
}

# The default device converts any format/rate/channels into the mixer.
pcm.!default {
	type plug
	slave.pcm "speaker"
}

ctl.!default {
	type hw
	card 0
}
