# BlueZ settings for the Smart Clock as a Bluetooth speaker (A2DP sink, via bluez-alsa).
[General]
Name = Smart Clock
# Audio/Video: Loudspeaker, with the Audio and Rendering service bits
Class = 0x240414
# Always discoverable and pairable: pairing needs no PIN (bt-agent, NoInputNoOutput)
DiscoverableTimeout = 0
PairableTimeout = 0
AlwaysPairable = true
JustWorksRepairing = always

[Policy]
AutoEnable = true
