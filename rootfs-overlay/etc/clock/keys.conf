# Button actions for clockkeys: a shell command per gesture (empty = nothing).
# After editing: kill $(pidof clockkeys), and init restarts it.
#
#   VOLUP, VOLDOWN   press; repeats while held
#   BOTH             both buttons pressed together
#   BOTH_LONG        both held for 2 seconds
#   MIC_OFF, MIC_ON  the mic switch on the back moved (state is also in /run/clock/mic)
#   TAP, DOUBLE_TAP  a tap on the case (the accelerometer); a double tap is two in 500 ms
#   TAP_THRESHOLD    how hard a tap has to be: 1-31 (x 62.5 mg), default 10
#
# While an alarm rings, any press snoozes it ("clock-alarm button" does nothing and fails
# otherwise), and holding both stops it. A double tap snoozes too, and otherwise lights the
# screen up for 10 seconds (autobright takes SIGUSR1 for that).
VOLUP="/usr/local/bin/clock-alarm button || /usr/local/bin/clock-volume up"
VOLDOWN="/usr/local/bin/clock-alarm button || /usr/local/bin/clock-volume down"
BOTH="/usr/local/bin/clock-alarm button || /usr/local/bin/ha-media play_pause"
BOTH_LONG="/usr/local/bin/clock-alarm stop"
MIC_OFF=""
MIC_ON=""
TAP=""
DOUBLE_TAP="/usr/local/bin/clock-alarm button || killall -USR1 autobright"
TAP_THRESHOLD=10
