# Clock face settings. After editing: kill $(pidof clockface), and init restarts it.

# Weather icon style:
#   ha         Home Assistant's own weather card icons (colour, static; default)
#   meteocons  colourful animated icons (meteocons.com)
ICON_STYLE=ha

# With meteocons, animation of the icon under the date:
#   always  animate all the time (~20% of one CPU core)
#   minute  play it through once a minute (default)
#   still   never animate (the forecast's icons still animate while it's shown)
ICON_ANIMATION=minute
