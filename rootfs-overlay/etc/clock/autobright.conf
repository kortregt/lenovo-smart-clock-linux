# Backlight curve for autobright: "sensor reading:backlight level" points (backlight 1-255),
# interpolated on a log scale. Readings: dark room < 5, lamplight tens to hundreds,
# daylight indoors a few hundred, a phone flashlight ~20000.
# After editing: kill $(pidof autobright) and init restarts it.
CURVE="3:6 20:60 100:130 300:190 3000:255"
