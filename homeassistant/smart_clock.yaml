# Home Assistant package for the Smart Clock's alarms (read by clock-alarm on the clock).
#
# Put this file in <config>/packages/ and enable packages in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then restart Home Assistant. The helpers show up under Settings -> Devices & services ->
# Helpers; their values can be changed from dashboards and automations (and by the clock).
# The clock also fires `smart_clock_alarm` events (data: state = ringing / snoozed /
# stopped, alarm = 1-3), for automations such as fading the lights up.

input_boolean:
  smart_clock_alarm_1:
    name: Smart Clock alarm 1
    icon: mdi:alarm
  smart_clock_alarm_2:
    name: Smart Clock alarm 2
    icon: mdi:alarm
  smart_clock_alarm_3:
    name: Smart Clock alarm 3
    icon: mdi:alarm

input_datetime:
  smart_clock_alarm_1_time:
    name: Smart Clock alarm 1 time
    has_date: false
    has_time: true
  smart_clock_alarm_2_time:
    name: Smart Clock alarm 2 time
    has_date: false
    has_time: true
  smart_clock_alarm_3_time:
    name: Smart Clock alarm 3 time
    has_date: false
    has_time: true

input_select:
  smart_clock_alarm_1_days: &days
    name: Smart Clock alarm 1 days
    icon: mdi:calendar-week
    options:
      - Every day
      - Weekdays
      - Weekends
      - Once
  smart_clock_alarm_2_days:
    <<: *days
    name: Smart Clock alarm 2 days
  smart_clock_alarm_3_days:
    <<: *days
    name: Smart Clock alarm 3 days
  # What the alarm plays: a built-in sound, or Music (the music settings below)
  smart_clock_alarm_sound:
    name: Smart Clock alarm sound
    icon: mdi:bell-ring
    options:
      - Chime
      - Soft bells
      - Beeps
      - Music
  smart_clock_alarm_media_type:
    name: Smart Clock alarm music type
    icon: mdi:playlist-music
    options:
      - playlist
      - radio
      - album
      - artist
      - track

input_text:
  # With the sound set to Music: a Music Assistant item, a name ("Morning") or a URI
  # (library://playlist/12, spotify://playlist/...). If it doesn't play, the Chime does.
  smart_clock_alarm_media:
    name: Smart Clock alarm music
    icon: mdi:music
    max: 255

input_number:
  smart_clock_alarm_volume:
    name: Smart Clock alarm volume
    icon: mdi:volume-high
    min: 5
    max: 100
    step: 5
    mode: slider

# The next alarm, for dashboards ("in 9 hours") and automations. Unavailable while all
# alarms are off.
template:
  - sensor:
      - name: Smart Clock next alarm
        unique_id: smart_clock_next_alarm
        icon: mdi:alarm
        device_class: timestamp
        availability: >
          {{ is_state('input_boolean.smart_clock_alarm_1', 'on')
             or is_state('input_boolean.smart_clock_alarm_2', 'on')
             or is_state('input_boolean.smart_clock_alarm_3', 'on') }}
        state: >
          {%- set ns = namespace(best=none) -%}
          {%- for i in [1, 2, 3] if is_state('input_boolean.smart_clock_alarm_' ~ i, 'on') -%}
            {%- set t = states('input_datetime.smart_clock_alarm_' ~ i ~ '_time') -%}
            {%- set days = states('input_select.smart_clock_alarm_' ~ i ~ '_days') -%}
            {%- for d in range(8) -%}
              {%- set dt = today_at(t) + timedelta(days=d) -%}
              {%- set wd = dt.isoweekday() -%}
              {%- if dt > now() and (days in ['Every day', 'Once'] or (days == 'Weekdays' and wd <= 5)
                    or (days == 'Weekends' and wd >= 6)) -%}
                {%- if ns.best is none or dt < ns.best -%}{%- set ns.best = dt -%}{%- endif -%}
                {%- break -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.best.isoformat() if ns.best is not none else '' }}
